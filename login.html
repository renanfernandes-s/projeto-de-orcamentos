<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar ou Cadastrar | Use OrçaFácilAPP</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- Favicons -->
    <link rel="shortcut icon" type="image/x-icon" href="/icons/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=3">
</head>

<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-6 space-y-6">

        <!-- Cabeçalho -->
        <div class="text-center">
            <h1 class="text-2xl font-black text-brand">
                Use <span class="text-emerald-500">OrçaFácil</span><span
                    class="text-xs text-slate-400 font-normal">.app</span>
            </h1>
            <p class="text-xs text-slate-500 mt-1">Acesse sua conta para criar e gerenciar orçamentos</p>
        </div>

        <div class="grid grid-cols-2 gap-1 rounded-lg bg-slate-100 p-1" role="tablist" aria-label="Acesso à conta">
            <button type="button" id="tab-login" role="tab" aria-selected="true"
                class="rounded-md bg-white px-3 py-2 text-xs font-bold text-brand shadow-sm transition">
                Entrar
            </button>
            <button type="button" id="tab-signup" role="tab" aria-selected="false"
                class="rounded-md px-3 py-2 text-xs font-bold text-slate-500 transition">
                Criar conta
            </button>
        </div>

        <!-- Formulário -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">E-mail</label>
                <input type="email" id="auth-email" required
                    class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label id="password-label"
                    class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Senha</label>
                <input type="password" id="auth-password" required minlength="10"
                    class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    placeholder="••••••••">
            </div>
            <div id="password-confirmation-group" class="hidden">
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Confirmar
                    senha</label>
                <input type="password" id="auth-password-confirmation" minlength="10" autocomplete="new-password"
                    class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    placeholder="Digite a senha novamente">
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFApg6-zgm8b7Ccf"></div>

            <!-- Botões de Ação -->
            <div class="space-y-2 pt-2">
                <button type="submit" id="btn-login"
                    class="w-full py-3 bg-brand hover:bg-brand-hover text-white font-bold rounded-xl shadow-md text-sm transition">
                    Entrar
                </button>

                <button type="button" id="btn-recovery"
                    class="w-full py-2 text-xs font-semibold text-indigo-700 hover:text-indigo-900 transition">
                    Esqueci minha senha
                </button>
            </div>
        </form>

        <div class="space-y-3">
            <div class="flex items-center gap-3" aria-hidden="true">
                <span class="h-px flex-1 bg-slate-200"></span>
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">ou</span>
                <span class="h-px flex-1 bg-slate-200"></span>
            </div>
            <button type="button" id="btn-google"
                class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-50 disabled:cursor-wait disabled:opacity-60"
                aria-label="Continuar com Google">
                <span aria-hidden="true" class="text-base font-black text-blue-600">G</span>
                Continuar com Google
            </button>
        </div>

        <section id="auth-feedback" class="hidden rounded-xl border border-indigo-100 bg-indigo-50 p-4"
            aria-live="polite">
            <h2 id="auth-feedback-title" class="text-sm font-bold text-brand"></h2>
            <p id="auth-feedback-message" class="mt-1 text-xs leading-relaxed text-slate-600"></p>
            <p id="auth-feedback-email" class="mt-2 text-xs font-bold text-indigo-900"></p>
            <div class="mt-3 flex flex-col gap-2 sm:flex-row">
                <button type="button" id="btn-resend-email"
                    class="rounded-lg bg-brand px-3 py-2 text-xs font-bold text-white transition hover:bg-brand-hover">
                    Reenviar e-mail
                </button>
                <button type="button" id="btn-back-auth"
                    class="rounded-lg border border-slate-300 px-3 py-2 text-xs font-bold text-slate-600 transition hover:bg-white">
                    Voltar
                </button>
            </div>
        </section>

        <div class="text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-slate-600 underline">← Voltar para a página inicial</a>
        </div>

    </div>

    <script type="module" src="/src/login.js"></script>
</body>

</html>
